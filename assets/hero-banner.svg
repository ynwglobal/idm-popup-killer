<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 52px; fill: #ffffff; letter-spacing: -0.5px; }
    .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 20px; fill: #94a3b8; letter-spacing: 0.2px; }
    .tag-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; letter-spacing: 1px; }
    .badge-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1198" height="358" x="1" y="1" rx="15" fill="none" stroke="url(#accentGrad)" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Ambient Light Circles -->
  <circle cx="1020" cy="180" r="140" fill="url(#glowGrad)" filter="url(#glow)" />
  <circle cx="150" cy="80" r="100" fill="#38bdf8" fill-opacity="0.08" filter="url(#glow)" />

  <!-- Decorative Grid Grid Lines -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="360" />
    <line x1="160" y1="0" x2="160" y2="360" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="320" y1="0" x2="320" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
  </g>

  <!-- Left Content Area -->
  <g transform="translate(90, 70)">
    <!-- Pill Tag -->
    <rect width="210" height="30" rx="15" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1" />
    <text x="14" y="20" class="tag-text">WIN32 POPUP DAEMON</text>

    <!-- Main Title -->
    <text x="0" y="80" class="title-text">IDM Popup Killer</text>
    
    <!-- Gradient Underline Bar -->
    <rect x="0" y="96" width="340" height="4" rx="2" fill="url(#accentGrad)" />

    <!-- Subtitle -->
    <text x="0" y="132" class="subtitle-text">Precision Win32 batch closer for IDM nag &amp; registration dialogs.</text>
    <text x="0" y="160" class="subtitle-text" fill="#64748b">Zero download disruption • Pure Python ctypes • Zero dependencies</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 195)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="20" cy="18" r="5" fill="#10b981" />
        <text x="34" y="23" class="badge-label">Active Downloads Safe</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(192, 0)">
        <rect width="160" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="20" cy="18" r="5" fill="#38bdf8" />
        <text x="34" y="23" class="badge-label">Parallel Escalation</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(364, 0)">
        <rect width="170" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="20" cy="18" r="5" fill="#a855f7" />
        <text x="34" y="23" class="badge-label">Zero Dependencies</text>
      </g>
    </g>
  </g>

  <!-- Right Graphic Illustration: Popup Being Intercepted -->
  <g transform="translate(900, 60)">
    <!-- Base Glow -->
    <circle cx="120" cy="120" r="110" fill="url(#accentGrad)" opacity="0.15" filter="url(#glow)" />

    <!-- Mock IDM Window (Background) -->
    <g transform="translate(0, 10)">
      <rect width="250" height="150" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#glow)" />
      <!-- Window Titlebar -->
      <rect width="250" height="28" rx="10" fill="#0f172a" />
      <rect width="250" height="10" y="18" fill="#0f172a" />
      <!-- Window Dots -->
      <circle cx="16" cy="14" r="4" fill="#ef4444" />
      <circle cx="28" cy="14" r="4" fill="#eab308" />
      <circle cx="40" cy="14" r="4" fill="#22c55e" />
      <!-- Window Content Lines -->
      <rect x="20" y="45" width="130" height="8" rx="4" fill="#334155" />
      <rect x="20" y="62" width="190" height="6" rx="3" fill="#1e293b" />
      <rect x="20" y="74" width="160" height="6" rx="3" fill="#1e293b" />
      <!-- Dismiss Button Target -->
      <rect x="150" y="105" width="80" height="28" rx="6" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5" />
      <text x="168" y="123" font-family="sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">CLOSE</text>
    </g>

    <!-- Shield & Crosshair Emblem Overlay -->
    <g transform="translate(140, 130)">
      <!-- Shield Shape -->
      <path d="M 0,-45 C 32,-45 45,-30 45,0 C 45,35 15,60 0,75 C -15,60 -45,35 -45,0 C -45,-30 -32,-45 0,-45 Z" fill="url(#shieldGrad)" filter="url(#glow)" stroke="#ffffff" stroke-width="2.5" />
      <!-- Lightning Bolt on Shield -->
      <polygon points="-4,-22 14,-22 2,-2 16,-2 -12,30 -4,6 -18,6" fill="#ffffff" />
    </g>
  </g>
</svg>
